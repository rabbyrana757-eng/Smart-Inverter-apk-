name: Build Smart Setup APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare Web App
        run: |
          mkdir -p www
          cp index.html www/index.html

      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Create Capacitor Project
        run: |
          npx cap init "Smart Setup" "com.smartsetup.app" --web-dir=www

      - name: Add Android
        run: |
          npx cap add android

      - name: Fix Kotlin Dependencies
        working-directory: android
        run: |
          cat >> build.gradle <<'EOF'

          allprojects {
              configurations.all {
                  resolutionStrategy {
                      force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
                  }
              }
          }
          EOF

      - name: Sync Web App
        run: |
          npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Smart Setup APK
        uses: actions/upload-artifact@v4
        with:
          name: Smart-Setup-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
